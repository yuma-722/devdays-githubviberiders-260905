name: Functions のテストと本番デプロイ
on:
  push:
    branches:
    - main
    paths:
    - backend/**
    - .github/workflows/deploy-function.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: functions-production
  cancel-in-progress: false

env:
  AZURE_FUNCTIONAPP_NAME: func-devdays-survey
  AZURE_FUNCTIONAPP_SOURCE_PATH: ./backend/Survey
  DOTNET_VERSION: 10.0.x
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: .NET のビルドと発行
      shell: bash
      run: |
        dotnet test ../Survey.Tests --configuration Release
        dotnet publish --configuration Release --output ./publish
      working-directory: ${{ env.AZURE_FUNCTIONAPP_SOURCE_PATH }}

    - name: 発行成果物を ZIP 化
      run: zip -r release.zip * .azurefunctions
      working-directory: ${{ env.AZURE_FUNCTIONAPP_SOURCE_PATH }}/publish

    - name: デプロイ成果物を保存
      uses: actions/upload-artifact@v7
      with:
        name: function-app
        path: ${{ env.AZURE_FUNCTIONAPP_SOURCE_PATH }}/publish/release.zip

  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read


    steps:
    - name: 発行成果物を取得
      uses: actions/download-artifact@v8
      with:
        name: function-app

    - name: OIDC で Azure にログイン
      uses: azure/login@v3
      with:
        client-id: ${{ vars.AZURE_CLIENT_ID }}
        tenant-id: ${{ vars.AZURE_TENANT_ID }}
        subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}


    - name: Flex Consumption にデプロイ
      uses: Azure/functions-action@v1
      with:
        app-name: ${{ env.AZURE_FUNCTIONAPP_NAME }}
        package: release.zip
        sku: flexconsumption
